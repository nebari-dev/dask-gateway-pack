name: Build Docker Images

# Builds the pack's single first-party image via the shared reusable workflow
# in nebari-dev/.github (GHCR + quay.io, sha-<short> and latest tags):
#
#   cluster — images/cluster/: pixi-locked scheduler/worker image. Its
#             pixi.toml is the pack's source of truth for the dask/
#             distributed/dask-gateway version triplet that client
#             environments (nebi pixi workspaces in the data-science-pack)
#             must match.
#
# Everything else runs upstream images pinned inside the dask-gateway
# subchart (ghcr.io/dask/dask-gateway-server for the api server and the
# kube-controller, docker.io/traefik for the internal proxy) — the same
# split classic nebari made, which built only the worker image first-party
# (quay.io/nebari/nebari-dask-worker in nebari-docker-images).
#
# The Quay repo must be created manually by a maintainer before the first
# push. (Releases do NOT pin image tags — provenance model; the chart's
# image tag is a plain values.yaml default bumped by normal PRs.)

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/build-images.yaml"
  pull_request:
    paths:
      - "images/**"
      - ".github/workflows/build-images.yaml"
  workflow_dispatch:

jobs:
  cluster:
    uses: nebari-dev/.github/.github/workflows/pack-build-image.yaml@v1
    with:
      # The reusable workflow prefixes the repo name itself:
      #   quay: quay.io/nebari/<repo>-<image> -> quay.io/nebari/dask-gateway-pack-cluster
      #   ghcr: ghcr.io/<owner>/<repo>/<image> -> ghcr.io/nebari-dev/dask-gateway-pack/cluster
      # so the input is just the suffix (matches the values.yaml default).
      image: cluster
      context: images/cluster
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
