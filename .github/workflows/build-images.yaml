name: Build Docker Images

# Builds the pack's single first-party image, mirroring
# nebari-dev/provenance-collector-pack's build-image.yaml:
#
#   images/cluster/ — pixi-locked scheduler/worker image. Its pixi.toml is the
#                     pack's source of truth for the dask/distributed/
#                     dask-gateway version triplet that client environments
#                     (nebi pixi workspaces in the data-science-pack) must
#                     match.
#
# Everything else runs upstream images pinned inside the dask-gateway
# subchart (ghcr.io/dask/dask-gateway-server for the api server and the
# kube-controller, docker.io/traefik for the internal proxy) — the same
# split classic nebari made, which built only the worker image first-party
# (quay.io/nebari/nebari-dask-worker in nebari-docker-images).
#
# Tags: <short-sha> and latest from main, pr-<N> / <branch> for PRs and
# dispatches, and X.Y.Z / X.Y on a published release. release.yaml stamps the
# chart's backend image tag to the same X.Y.Z, so chart and image versions
# move together.
#
# Quay pushes use the repo-level QUAY_USERNAME / QUAY_PASSWORD secrets (the
# shared Nebari software-pack image bot). The bot cannot create Quay repos on
# push, so quay.io/nebari/dask-gateway-pack must exist with the bot granted
# write.

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/build-images.yaml"
  pull_request:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/build-images.yaml"
  release:
    types: [published]
  workflow_dispatch:

# Cancel in-flight PR builds when a new commit lands on the same PR; leave
# `main` pushes and releases alone so we never lose a release artifact mid-run.
concurrency:
  group: build-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  QUAY_IMAGE: quay.io/nebari/${{ github.event.repository.name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Fork PRs can't read QUAY_USERNAME/QUAY_PASSWORD and would fail at the
    # login step; Dependabot PRs run against a separate secrets store, so the
    # Quay secrets are empty there too. Skip both.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Buildx needs the docker-container driver to attach OCI attestations
      # (sbom: true, provenance: mode=max).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.QUAY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/cluster
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      # Keyless cosign signature over the pushed digest, in both registries.
      # Skipped on PRs, which have no durable published artifact worth signing.
      - name: Sign images (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          for repo in "${GHCR_IMAGE}" "${QUAY_IMAGE}"; do
            echo "Signing ${repo}@${DIGEST}"
            cosign sign "${repo}@${DIGEST}"
          done
