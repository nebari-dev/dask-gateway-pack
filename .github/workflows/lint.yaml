name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | \
            sudo tar -xz -C /usr/local/bin kubeconform

      # Chart is at repo root (like data-science-pack), wrapping the upstream
      # dask-gateway chart pinned in Chart.yaml / Chart.lock.
      - name: Update dask-gateway dependency
        run: helm dependency update .

      - name: Lint chart
        run: helm lint .

      - name: Template (NebariApp disabled / standalone)
        run: helm template test . --set nebariapp.enabled=false

      - name: Template (NebariApp enabled)
        run: |
          helm template test . \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=dask-gateway.example.com

      # Render the opt-in external scheduler proxy so a selector/label drift on
      # a subchart bump (or a broken fail-guard) fails here, not silently in a
      # cluster with a zero-endpoint LoadBalancer.
      - name: Template (external scheduler proxy enabled)
        run: |
          helm template test . \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=dask-gateway.example.com \
            --set schedulerProxy.external.enabled=true \
            | grep -q "component: scheduler-proxy-external" \
            || { echo "external scheduler proxy Service did not render"; exit 1; }

      - name: Validate rendered manifests with kubeconform
        run: |
          # -ignore-missing-schemas: NebariApp, DaskCluster, Envoy Gateway
          # SecurityPolicy, and the subchart's inert Traefik objects have no
          # upstream JSON schemas.
          helm template test . \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=dask-gateway.example.com \
            | kubeconform -strict -ignore-missing-schemas
