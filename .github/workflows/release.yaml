name: Release Chart

# Releases the pack chart via the shared reusable workflow in nebari-dev/.github.
# On a Chart.yaml version bump it pins the first-party image tags to the
# release commit's sha, packages the chart, creates a GitHub Release, and
# opens a PR in nebari-dev/helm-repository (which publishes to
# quay.io/nebari/charts). Requires the org-provided NEBARI_HELM_REPO_TOKEN, so
# this only works for official packs inside the nebari-dev org.
#
# dask-gateway-pack specifics:
#   - chart-path is "." (chart at repo root, like data-science-pack).
#   - tag-paths pins the single first-party image built by build-images.yaml
#     (the pixi-locked cluster/scheduler-worker image). Gateway server,
#     controller, and the internal Traefik stay on upstream images pinned
#     inside the dask-gateway subchart.

on:
  push:
    branches: [main]
    paths:
      - "Chart.yaml"

jobs:
  release:
    uses: nebari-dev/.github/.github/workflows/pack-release.yaml@v1
    with:
      chart-path: .
      chart-name: dask-gateway-pack
      tag-paths: |
        dask-gateway.gateway.backend.image.tag
    secrets:
      NEBARI_HELM_REPO_TOKEN: ${{ secrets.NEBARI_HELM_REPO_TOKEN }}
