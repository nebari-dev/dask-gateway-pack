name: Test

# Standalone functional test on kind (no Nebari operator, all-upstream
# components).
#
# dask-gateway-pack specifics vs the software-pack-template test.yaml:
#   - gateway.auth.type is switched to "simple" because there is no JupyterHub
#     in this cluster to validate tokens against (the pack default is
#     jupyterhub auth, which would fail the Secret mount for "hub").
#   - Health check hits the gateway REST api through the subchart's Traefik
#     proxy Service (in-cluster entrypoint, ClusterIP).
#   - A smoke test creates a real DaskCluster through the api AND connects a
#     dask client to it through Traefik's scheduler proxy (TLS/SNI
#     passthrough) — the full in-cluster path DSP users exercise.
#   - The default backend image is overridden to the upstream
#     ghcr.io/dask/dask-gateway until quay.io/nebari/dask-gateway-pack-cluster
#     is published; drop the override after the first image release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pack-test

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Update dask-gateway dependency
        run: helm dependency update .

      - name: Install chart (standalone, simple auth)
        run: |
          helm install test-dg . \
            --create-namespace --namespace test-dg \
            --set nebariapp.enabled=false \
            --set dask-gateway.gateway.auth.type=simple \
            --set dask-gateway.gateway.auth.simple.password=test-password \
            --set dask-gateway.gateway.backend.image.name=ghcr.io/dask/dask-gateway \
            --set dask-gateway.gateway.backend.image.tag=2026.3.0 \
            --wait --timeout 5m

      - name: Wait for gateway components
        run: |
          kubectl wait -n test-dg --for=condition=available \
            deployment -l app.kubernetes.io/name=dask-gateway --timeout=180s
          kubectl get pods -n test-dg

      - name: Health check gateway api via traefik proxy
        run: |
          # Release name "test-dg" does not contain "dask-gateway", so the
          # subchart fullname is "test-dg-dask-gateway".
          kubectl port-forward -n test-dg svc/traefik-test-dg-dask-gateway 8080:80 &
          sleep 3
          curl -sf http://localhost:8080/api/health
          kill %1

      - name: Smoke test - create a cluster and connect a client through the proxy
        run: |
          pip install "dask-gateway==2026.3.0"
          # web entrypoint (api) on 80, dedicated scheduler tcp entrypoint on 8786
          kubectl port-forward -n test-dg svc/traefik-test-dg-dask-gateway 8080:80 8786:8786 &
          sleep 3
          python - <<'EOF'
          from dask_gateway import Gateway, BasicAuth
          gw = Gateway(
              "http://localhost:8080",
              # tls:// not tcp:// — scheduler comms are TLS+SNI passthrough
              # (mTLS terminated at the scheduler); plain tcp is reset by peer.
              proxy_address="tls://localhost:8786",
              auth=BasicAuth(password="test-password"),
          )
          cluster = gw.new_cluster(shutdown_on_close=True)
          print("cluster:", cluster.name)
          cluster.scale(1)
          # Full path: client -> traefik (SNI passthrough) -> scheduler.
          with cluster.get_client() as client:
              assert client.submit(lambda x: x + 1, 1).result() == 2
          print("client compute OK")
          cluster.shutdown()
          print("OK")
          EOF
          kill %1

      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get pods -n test-dg -o wide || true
          kubectl get daskclusters -A || true
          kubectl get ingressroute,ingressroutetcp -n test-dg || true
          kubectl logs -n test-dg -l app.kubernetes.io/component=controller --tail=200 || true
          kubectl get events -n test-dg --sort-by=.lastTimestamp | tail -50 || true

      - name: Uninstall
        if: always()
        run: helm uninstall test-dg -n test-dg --wait || true
