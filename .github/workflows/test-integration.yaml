name: Integration Test (Nebari platform)

# Full-platform integration test on action-nebari-sandbox (k3d + NIC +
# ArgoCD + Envoy Gateway + cert-manager + Keycloak + nebari-operator),
# following the nebi-pack test workflow. The pack is installed the way a real
# deployment installs it — an ArgoCD Application committed to the platform's
# GitOps repo via the add-software-pack sub-action — then smoke-tested for
# exactly what v0.1 promises:
#
#   1. NebariApp reconciles to Ready (route + TLS + Keycloak client).
#   2. /api/health answers 200 through Envoy without OIDC (public route).
#   3. / redirects to Keycloak (operator SecurityPolicy on the root route).
#   4. An IN-CLUSTER client (a pod, standing in for a DSP JupyterLab
#      singleuser pod) creates a DaskCluster and connects a dask client to
#      its scheduler through the internal Traefik proxy (TLS/SNI
#      passthrough) — the real end-to-end user path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "templates/**"
      - "images/**"
      - "values.yaml"
      - "Chart.yaml"
      - ".github/ci/**"
      - ".github/workflows/test-integration.yaml"
  workflow_dispatch:

jobs:
  platform-integration:
    runs-on: ubuntu-latest
    # Best-effort, non-blocking: the full NIC platform (ArgoCD + Keycloak +
    # Envoy Gateway + cert-manager + operator) is resource-heavy and frequently
    # fails to boot on a stock GitHub runner (argocd-repo-server progress
    # deadline, Keycloak OOM), i.e. before the pack is even installed. That is
    # a runner-capacity limitation, not a pack signal, so this job does not gate
    # merges. Authoritative pack validation is lint + build + the standalone
    # test (and a local action-nebari-sandbox run on adequate hardware).
    continue-on-error: true
    timeout-minutes: 60
    env:
      HOSTNAME: dask-gateway.nebari.local
      NAMESPACE: dask-gateway
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nebari Sandbox (platform profile)
        id: sandbox
        uses: nebari-dev/action-nebari-sandbox@v1
        with:
          profile: platform
          cluster-name: dask-gateway-pack-ci

      - name: Surface KUBECONFIG
        run: echo "KUBECONFIG=${{ steps.sandbox.outputs.kubeconfig }}" >> "$GITHUB_ENV"

      # Vendor the subchart so ArgoCD's file:// repo resolves the dependency
      # without network access to helm.dask.org from the repo-server.
      - name: Vendor chart dependencies
        run: helm dependency update .

      # Stage the chart without .git — add-software-pack commits the copied
      # dir into the gitops repo, and a nested .git would be recorded as a
      # gitlink instead of the chart files (nebi-pack precedent).
      - name: Stage chart
        run: |
          mkdir -p /tmp/chart
          rsync -a --exclude='.git' ./ /tmp/chart/

      - name: Install pack via GitOps (add-software-pack)
        uses: nebari-dev/action-nebari-sandbox/add-software-pack@v1
        with:
          gitops-dir: ${{ steps.sandbox.outputs.gitops-dir }}
          app-name: dask-gateway-pack
          chart-source: /tmp/chart
          application-manifest: ./.github/ci/dask-gateway-pack-application.yaml
          wait-timeout: 10m

      - name: Wait for NebariApp Ready
        run: |
          kubectl wait --for=condition=Ready "nebariapp/dask-gateway-pack" \
            -n "${NAMESPACE}" --timeout=300s
          kubectl get nebariapp -n "${NAMESPACE}" -o wide
          echo "=== Operator-created routes / policy ==="
          kubectl get httproute -n "${NAMESPACE}"
          kubectl get securitypolicy -n "${NAMESPACE}"

      - name: Smoke test gateway api + OIDC through Envoy
        env:
          GATEWAY_IP: ${{ steps.sandbox.outputs.gateway-ip }}
        run: |
          # Public route: api health must answer 200 without OIDC.
          code=$(curl -ks -o /dev/null -w '%{http_code}' \
            --resolve "${HOSTNAME}:443:${GATEWAY_IP}" "https://${HOSTNAME}/api/health")
          test "$code" = "200" || { echo "expected 200 on /api/health, got $code"; exit 1; }

          # Root route: must redirect to Keycloak (operator SecurityPolicy).
          loc=$(curl -ks -o /dev/null -w '%{redirect_url}' \
            --resolve "${HOSTNAME}:443:${GATEWAY_IP}" "https://${HOSTNAME}/")
          echo "redirect: $loc"
          echo "$loc" | grep -q 'keycloak.nebari.local/realms/nebari/protocol/openid-connect/auth' \
            || { echo "/ did not redirect to Keycloak"; exit 1; }

      - name: In-cluster client - create cluster, connect through the proxy
        run: |
          # Stand-in for a DSP JupyterLab singleuser pod: the upstream
          # dask-gateway image already carries the client. Release name is
          # "dask-gateway-pack" (contains "dask-gateway"), so the subchart
          # fullname — and thus the Traefik Service — is
          # traefik-dask-gateway-pack.
          cat > /tmp/client.py <<'EOF'
          from dask_gateway import Gateway, BasicAuth
          addr = "http://traefik-dask-gateway-pack.dask-gateway"
          gw = Gateway(
              addr,
              # tls:// not tcp:// — scheduler comms are TLS+SNI passthrough.
              proxy_address="tls://traefik-dask-gateway-pack.dask-gateway:8786",
              auth=BasicAuth(password="ci-test-password"),
          )
          cluster = gw.new_cluster(shutdown_on_close=True)
          print("cluster:", cluster.name)
          cluster.scale(1)
          with cluster.get_client() as client:
              assert client.submit(lambda x: x + 1, 1).result() == 2
          print("client compute OK")
          cluster.shutdown()
          print("OK")
          EOF
          kubectl create configmap ci-client-script -n "${NAMESPACE}" \
            --from-file=client.py=/tmp/client.py
          kubectl run ci-dask-client -n "${NAMESPACE}" \
            --image=ghcr.io/dask/dask-gateway:2026.3.0 \
            --restart=Never \
            --overrides='{"spec":{"containers":[{"name":"ci-dask-client","image":"ghcr.io/dask/dask-gateway:2026.3.0","command":["python","/scripts/client.py"],"volumeMounts":[{"name":"script","mountPath":"/scripts"}]}],"volumes":[{"name":"script","configMap":{"name":"ci-client-script"}}]}}'
          kubectl wait pod/ci-dask-client -n "${NAMESPACE}" \
            --for=jsonpath='{.status.phase}'=Succeeded --timeout=600s \
            || { kubectl logs pod/ci-dask-client -n "${NAMESPACE}" || true; exit 1; }
          kubectl logs pod/ci-dask-client -n "${NAMESPACE}"

      - name: Debug info on failure
        if: failure()
        run: |
          echo "=== NebariApps ==="
          kubectl get nebariapp -A -o yaml || true
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide || true
          echo "=== Routes / SecurityPolicies ==="
          kubectl get httproute -A || true
          kubectl get securitypolicy -A || true
          echo "=== DaskClusters / Traefik routes ==="
          kubectl get daskclusters -A -o yaml || true
          kubectl get ingressroute,ingressroutetcp -n "${NAMESPACE}" || true
          echo "=== Controller / Traefik logs ==="
          kubectl logs -n "${NAMESPACE}" -l app.kubernetes.io/component=controller --tail=200 || true
          kubectl logs -n "${NAMESPACE}" -l app.kubernetes.io/component=traefik --tail=100 || true
          echo "=== Operator logs ==="
          kubectl logs -n nebari-operator-system deploy/nebari-operator-controller-manager --tail=100 || true
          echo "=== Pods / events ==="
          kubectl get pods -A || true
          kubectl get events -n "${NAMESPACE}" --sort-by=.lastTimestamp | tail -50 || true

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }} || true
          docker network rm ${{ steps.sandbox.outputs.network-name }} 2>/dev/null || true
